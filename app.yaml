runtime: python312

env_variables:
  GOOGLE_GENAI_USE_VERTEXAI: "1"
  GOOGLE_CLOUD_PROJECT: "viz-tool-465716"
  GOOGLE_CLOUD_LOCATION: "us-central1"
  STORAGE_BUCKET_NAME: "vector-db22072025"
  MAX_FILE_SIZE_MB: "1024"
  MAX_DIRECT_PROCESSING_SIZE_MB: "100"
  SESSION_CLEANUP_HOURS: "24"
  LOG_LEVEL: "INFO"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

resources:
  cpu: 2
  memory_gb: 8

handlers:
- url: /static
  static_dir: app/static
  secure: always

- url: /uploads
  static_dir: uploads
  secure: always

- url: /.*
  script: main.app
  secure: always