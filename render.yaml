services:
  - type: web
    name: data-viz-platform
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPENROUTER_API_KEY
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/src/app/uploads
      sizeGB: 1
