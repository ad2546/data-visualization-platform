<!DOCTYPE html>
<html>
<head>
    <title>Data Visualization - focused on what anime should i watch</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; margin: 20px; }
        .chart { width: 100%; height: 400px; margin: 20px 0; }
        h1 { color: #4CAF50; text-align: center; }
    </style>
</head>
<body>
    <h1>Data Visualization Dashboard</h1>
    <div id="chart1" class="chart"></div>
    
    <script>
        var data = [{'url': 'https://myanimelist.net/anime/11349/Soredemo_Tsuma_wo_Aishiteru', 'mal_id': 11349}, {'url': 'https://myanimelist.net/anime/6120/Mitama__Nin', 'mal_id': 6120}, {'url': 'https://myanimelist.net/anime/54367/Artiswitch_Collection_2021', 'mal_id': 54367}, {'url': 'https://myanimelist.net/anime/48612/Journey__Taiko_Arabia_Hantou_de_no_Kiseki_to_Tatakai_no_Monogatari', 'mal_id': 48612}, {'url': 'https://myanimelist.net/anime/2928/hack__GU_Returner', 'mal_id': 2928}, {'url': 'https://myanimelist.net/anime/32262/Renai_Boukun', 'mal_id': 32262}, {'url': 'https://myanimelist.net/anime/45141/Meng_wa', 'mal_id': 45141}, {'url': 'https://myanimelist.net/anime/41069/AAside', 'mal_id': 41069}, {'url': 'https://myanimelist.net/anime/1520/Black_Jack', 'mal_id': 1520}, {'url': 'https://myanimelist.net/anime/12957/First_Love', 'mal_id': 12957}];
        
        var trace = {
            x: data.map(d => d['url']),
            y: data.map(d => d['mal_id']),
            type: 'bar',
            marker: { color: '#4CAF50' }
        };
        
        var layout = {
            title: 'mal_id by url',
            paper_bgcolor: '#1a1a1a',
            plot_bgcolor: '#1a1a1a',
            font: { color: 'white' },
            xaxis: { color: 'white' },
            yaxis: { color: 'white' }
        };
        
        Plotly.newPlot('chart1', [trace], layout);
    </script>
</body>
</html>
