<!DOCTYPE html>
<html>
<head>
    <title>Data Visualization - focused on can you tell me what genre has highest ratings</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; margin: 20px; }
        .chart { width: 100%; height: 400px; margin: 20px 0; }
        h1 { color: #4CAF50; text-align: center; }
    </style>
</head>
<body>
    <h1>Data Visualization Dashboard</h1>
    <div id="chart1" class="chart"></div>
    
    <script>
        var data = [{'show_id': 's1', 'release_year': 2020}, {'show_id': 's2', 'release_year': 2021}, {'show_id': 's3', 'release_year': 2021}, {'show_id': 's4', 'release_year': 2021}, {'show_id': 's5', 'release_year': 2021}, {'show_id': 's6', 'release_year': 2021}, {'show_id': 's7', 'release_year': 2021}, {'show_id': 's8', 'release_year': 1993}, {'show_id': 's9', 'release_year': 2021}, {'show_id': 's10', 'release_year': 2021}];
        
        var trace = {
            x: data.map(d => d['show_id']),
            y: data.map(d => d['release_year']),
            type: 'bar',
            marker: { color: '#4CAF50' }
        };
        
        var layout = {
            title: 'release_year by show_id',
            paper_bgcolor: '#1a1a1a',
            plot_bgcolor: '#1a1a1a',
            font: { color: 'white' },
            xaxis: { color: 'white' },
            yaxis: { color: 'white' }
        };
        
        Plotly.newPlot('chart1', [trace], layout);
    </script>
</body>
</html>
