<!DOCTYPE html>
<html lang="en">
<head>
        <script>
        // Chunked data loading system for large datasets
        window.sessionId = '618389c5-f7cf-4afa-ba18-d40d1dfbc138';
        window.datasetInfo = {
            totalRows: 8807,
            columns: 12,
            columnNames: ['show_id', 'type', 'title', 'director', 'cast', 'country', 'date_added', 'release_year', 'rating', 'duration', 'listed_in', 'description'],
            columnTypes: {'show_id': 'object', 'type': 'object', 'title': 'object', 'director': 'object', 'cast': 'object', 'country': 'object', 'date_added': 'object', 'release_year': 'int64', 'rating': 'object', 'duration': 'object', 'listed_in': 'object', 'description': 'object'},
            numericColumns: ['release_year'],
            categoricalColumns: ['show_id', 'type', 'title', 'director', 'cast', 'country', 'date_added', 'rating', 'duration', 'listed_in', 'description']
        };
        
        // Initialize empty data containers
        window.dataColumns = {};
        window.allDataLoaded = false;
        window.currentOffset = 0;
        window.chunkSize = 1000;
        
        // Load data in chunks to avoid response size limits
        async function loadDataChunk(start = 0, limit = 1000) {
            try {
                const response = await fetch(`/data/${window.sessionId}/chunk?start=${start}&limit=${limit}`);
                const result = await response.json();
                
                if (result.data) {
                    // Merge new chunk data with existing data
                    for (const [col, values] of Object.entries(result.data)) {
                        if (!window.dataColumns[col]) {
                            window.dataColumns[col] = [];
                        }
                        window.dataColumns[col] = window.dataColumns[col].concat(values);
                    }
                    
                    console.log(`Loaded chunk ${start}-${start + result.chunk_size} of ${result.total_rows} rows`);
                    
                    // Update loading progress
                    const progress = Math.min(100, ((start + result.chunk_size) / result.total_rows) * 100);
                    updateLoadingProgress(progress);
                    
                    // Load next chunk if there's more data
                    if (result.has_more && (start + limit) < result.total_rows) {
                        return await loadDataChunk(start + limit, limit);
                    } else {
                        window.allDataLoaded = true;
                        console.log('All data loaded successfully');
                        onDataLoadComplete();
                        return true;
                    }
                }
                return false;
            } catch (error) {
                console.error('Error loading data chunk:', error);
                return false;
            }
        }
        
        // Show loading progress
        function updateLoadingProgress(percent) {
            const progressBar = document.getElementById('dataLoadingProgress');
            const progressText = document.getElementById('dataLoadingText');
            if (progressBar) {
                progressBar.style.width = percent + '%';
            }
            if (progressText) {
                progressText.textContent = `Loading data: ${Math.round(percent)}%`;
            }
        }
        
        // Called when all data is loaded
        function onDataLoadComplete() {
            const loadingDiv = document.getElementById('dataLoadingIndicator');
            if (loadingDiv) {
                loadingDiv.style.display = 'none';
            }
            
            // Trigger chart creation/update
            if (typeof createCharts === 'function') {
                createCharts();
            } else {
                console.log('Data loaded, but createCharts function not found');
            }
        }
        
        // Utility functions for template compatibility
        window.getColumn = function(colName) {
            return window.dataColumns[colName] || [];
        };
        
        window.getNumericColumns = function() {
            return window.datasetInfo.numericColumns;
        };
        
        window.getCategoricalColumns = function() {
            return window.datasetInfo.categoricalColumns;
        };
        
        // Auto-start data loading when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Starting chunked data loading for session 618389c5-f7cf-4afa-ba18-d40d1dfbc138');
            loadDataChunk(0, window.chunkSize);
        });
        </script>
        
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Entertainment Dashboard</title>
    <!-- Plotly.js CDN for charting -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 600;
        }
        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }
        .chart-card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease-in-out;
        }
        .chart-card:hover {
            transform: translateY(-5px);
        }
        .chart-placeholder {
            width: 100%;
            height: 350px; /* Consistent height for all charts */
        }
    </style>
</head>
<body>
        <div id="dataLoadingIndicator" style="
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.8); 
            color: white; 
            padding: 20px; 
            border-radius: 10px; 
            text-align: center;
            z-index: 1000;">
            <div id="dataLoadingText">Loading data: 0%</div>
            <div style="width: 200px; height: 10px; background: #333; border-radius: 5px; margin: 10px auto;">
                <div id="dataLoadingProgress" style="width: 0%; height: 100%; background: #4CAF50; border-radius: 5px; transition: width 0.3s;"></div>
            </div>
        </div>
        

    <h1>Executive Entertainment Dashboard</h1>

    <div class="dashboard-container">
        <div class="chart-card">
            <div id="barChart" class="chart-placeholder"></div>
        </div>
        <div class="chart-card">
            <div id="lineChart" class="chart-placeholder"></div>
        </div>
        <div class="chart-card">
            <div id="scatterChart" class="chart-placeholder"></div>
        </div>
        <div class="chart-card">
            <div id="pieChart" class="chart-placeholder"></div>
        </div>
    </div>

    <script>
        /**
         * Simulates a dataset based on the provided business domain and column descriptions.
         * This function generates realistic-looking data for demonstration purposes.
         * @param {number} numRows - The number of rows to generate in the simulated dataset.
         * @returns {Array<Object>} An array of objects, each representing a row of data.
         */
        function generateSimulatedData(numRows) {
            const data = [];
            // Simulated content titles for the bar chart
            const contentTitles = [
                "The Grand Adventure", "Mystery of the Lost City", "Galactic Odyssey",
                "Whispers in the Dark", "The Last Stand", "Echoes of Tomorrow",
                "Crimson Tide", "Silent Witness", "Beyond the Horizon",
                "The Iron Will", "Starlight Serenade", "Urban Legends",
                "Desert Bloom", "Frozen Frontier", "The Quantum Leap",
                "Chronicles of Eldoria", "The Forgotten Realm", "Pixel Perfect",
                "Code Breakers", "The Infinite Loop"
            ];
            // Simulated content ratings
            const ratings = ['TV-MA', 'TV-PG', 'PG-13', 'G', 'R', 'NC-17', 'TV-Y7', 'TV-G', 'TV-14'];
            // Content types
            const types = ['Movie', 'TV Show'];

            for (let i = 0; i < numRows; i++) {
                const releaseYear = Math.floor(Math.random() * (2021 - 1925 + 1)) + 1925; // Range 1925-2021
                
                // Simulate date_added within a recent range for trend analysis
                const dateAdded = new Date(
                    2018 + Math.floor(Math.random() * 4), // Years 2018-2021
                    Math.floor(Math.random() * 12),      // Months 0-11
                    Math.floor(Math.random() * 28) + 1   // Days 1-28
                );
                
                const score = parseFloat((Math.random() * 9 + 1).toFixed(1)); // Rating/Score: 1.0 to 10.0
                const popularity = Math.floor(Math.random() * 9901) + 100; // Popularity: 100 to 10000
                const audienceSize = Math.floor(Math.random() * 990001) + 10000; // Audience Size: 10,000 to 1,000,000

                data.push({
                    date_added: dateAdded.toISOString().split('T')[0], // Format YYYY-MM-DD
                    rating: ratings[Math.floor(Math.random() * ratings.length)],
                    release_year: releaseYear,
                    type: types[Math.floor(Math.random() * types.length)],
                    score: score,
                    popularity: popularity,
                    audience_size: audienceSize,
                    // Assign a content title for the bar chart (simulating individual content)
                    content_title: contentTitles[Math.floor(Math.random() * contentTitles.length)]
                });
            }
            return data;
        }

        // Generate the simulated dataset with 8807 rows as specified
        const simulatedData = generateSimulatedData(8807);

        /**
         * Creates and renders all four executive dashboard charts using Plotly.js.
         * This function encapsulates the logic for data processing and chart rendering.
         */
        function createCharts() {
            // --- Chart 1: Bar - Top Rated Content Performance ---
            // Business Value: Identify the highest-performing content by average score.
            // Data Processing: Aggregate scores by content title and calculate average.
            const contentScores = {};
            simulatedData.forEach(d => {
                if (!contentScores[d.content_title]) {
                    contentScores[d.content_title] = { sum: 0, count: 0 };
                }
                contentScores[d.content_title].sum += d.score;
                contentScores[d.content_title].count++;
            });

            const aggregatedContent = Object.keys(contentScores).map(title => ({
                title: title,
                avg_score: contentScores[title].sum / contentScores[title].count
            }));

            // Sort by average score in descending order and take the top 10
            aggregatedContent.sort((a, b) => b.avg_score - a.avg_score);
            const topN = 10;
            const topContent = aggregatedContent.slice(0, topN);

            const barData = [{
                x: topContent.map(d => d.title),
                y: topContent.map(d => d.avg_score),
                type: 'bar',
                marker: { color: '#3498db' }, // A pleasant blue
                hovertemplate: '<b>%{x}</b><br>Average Score: %{y:.1f}<extra></extra>'
            }];

            const barLayout = {
                title: {
                    text: '<b>Top 10 Content Titles by Average Score</b>',
                    font: { size: 18 }
                },
                xaxis: {
                    title: 'Content Title',
                    tickangle: -45, // Angle labels for readability
                    automargin: true // Adjust margin automatically for long labels
                },
                yaxis: {
                    title: 'Average Score (1-10)',
                    range: [0, 10]
                },
                margin: { b: 150, t: 60 }, // Adjust bottom margin for x-axis labels
                hovermode: 'closest'
            };

            Plotly.newPlot('barChart', barData, barLayout);

            // --- Chart 2: Line - Popularity Trends Over Time ---
            // Business Value: Understand the overall trend of content popularity over time.
            // Data Processing: Aggregate average popularity by month of 'date_added'.
            const popularityByMonth = {};
            simulatedData.forEach(d => {
                const date = new Date(d.date_added);
                // Group by YYYY-MM for monthly trend
                const monthYear = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`;
                if (!popularityByMonth[monthYear]) {
                    popularityByMonth[monthYear] = { sum: 0, count: 0 };
                }
                popularityByMonth[monthYear].sum += d.popularity;
                popularityByMonth[monthYear].count++;
            });

            // Sort months chronologically for the line chart
            const sortedMonths = Object.keys(popularityByMonth).sort();
            const lineX = sortedMonths;
            const lineY = sortedMonths.map(month => popularityByMonth[month].sum / popularityByMonth[month].count);

            const lineData = [{
                x: lineX,
                y: lineY,
                mode: 'lines+markers',
                marker: { color: '#2ecc71', size: 6 }, // Green markers
                line: { color: '#2ecc71', width: 2 }, // Green line
                hovertemplate: '<b>Date:</b> %{x}<br><b>Avg. Popularity:</b> %{y:.0f}<extra></extra>'
            }];

            const lineLayout = {
                title: {
                    text: '<b>Monthly Popularity Trend of Added Content</b>',
                    font: { size: 18 }
                },
                xaxis: {
                    title: 'Date Added (Month/Year)',
                    type: 'category', // Treat dates as categories to prevent continuous scale issues with gaps
                    tickangle: -45,
                    automargin: true
                },
                yaxis: {
                    title: 'Average Popularity'
                },
                margin: { t: 60 },
                hovermode: 'x unified' // Show hover info for all traces at a given x-value
            };

            Plotly.newPlot('lineChart', lineData, lineLayout);

            // --- Chart 3: Scatter - Rating vs Audience Size Correlation ---
            // Business Value: Explore the relationship between content quality (score) and its reach (audience size).
            // Data Processing: Direct use of 'score' and 'audience_size' columns.
            const scatterX = simulatedData.map(d => d.score);
            const scatterY = simulatedData.map(d => d.audience_size);

            const scatterData = [{
                x: scatterX,
                y: scatterY,
                mode: 'markers',
                type: 'scatter',
                marker: {
                    color: '#e74c3c', // A vibrant red
                    size: 6,
                    opacity: 0.6,
                    line: {
                        color: 'white',
                        width: 0.5
                    }
                },
                hovertemplate: '<b>Score:</b> %{x:.1f}<br><b>Audience Size:</b> %{y:,}<extra></extra>'
            }];

            const scatterLayout = {
                title: {
                    text: '<b>Content Score vs. Audience Engagement</b>',
                    font: { size: 18 }
                },
                xaxis: {
                    title: 'Content Score (1-10)',
                    range: [0, 10]
                },
                yaxis: {
                    title: 'Audience Size'
                },
                margin: { t: 60 },
                hovermode: 'closest'
            };

            Plotly.newPlot('scatterChart', scatterData, scatterLayout);

            // --- Chart 4: Pie - Content Type Distribution ---
            // Business Value: Visualize the proportion of different content types (Movie vs. TV Show) in the catalog.
            // Data Processing: Count occurrences of each 'type'.
            const typeCounts = {};
            simulatedData.forEach(d => {
                typeCounts[d.type] = (typeCounts[d.type] || 0) + 1;
            });

            const pieLabels = Object.keys(typeCounts);
            const pieValues = Object.values(typeCounts);

            const pieData = [{
                labels: pieLabels,
                values: pieValues,
                type: 'pie',
                marker: {
                    colors: ['#9b59b6', '#f1c40f'] // Purple for Movies, Yellow for TV Shows
                },
                hoverinfo: 'label+percent+value', // Show label, percentage, and raw value on hover
                textinfo: 'percent', // Show percentage on slices
                insidetextorientation: 'radial',
                automargin: true // Adjust margins automatically for labels
            }];

            const pieLayout = {
                title: {
                    text: '<b>Distribution of Content Types</b>',
                    font: { size: 18 }
                },
                height: 350, // Match placeholder height
                width: 450,  // Match placeholder width
                margin: { t: 60, b: 50, l: 50, r: 50 }, // Adjust margins for better fit
                showlegend: true // Display legend for labels
            };

            Plotly.newPlot('pieChart', pieData, pieLayout);
        }

        // Ensure the DOM is fully loaded before attempting to create charts
        document.addEventListener('DOMContentLoaded', createCharts);
    </script>

</body>
</html>
