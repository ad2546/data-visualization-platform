<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Dataset - Professional Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 300;
        }
        .row {
            display: flex;
            width: 100%;
            margin-bottom: 20px;
            gap: 20px;
        }
        .column {
            flex: 1;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }
        .column:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
        }
        .chart-title {
            text-align: center;
            margin-bottom: 15px;
            color: #34495e;
            font-size: 1.2rem;
            font-weight: 500;
        }
        .chart-container {
            min-height: 400px;
            width: 100%;
        }
        @media (max-width: 768px) {
            .row {
                flex-direction: column;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Anime Dataset Visualization Dashboard</h1>
        
        <div class="row">
            <div class="column">
                <h2 class="chart-title">Top 10 Anime by MAL ID</h2>
                <div class="chart-container" id="barChart"></div>
            </div>
            <div class="column">
                <h2 class="chart-title">MAL ID Trend</h2>
                <div class="chart-container" id="lineChart"></div>
            </div>
        </div>
        
        <div class="row">
            <div class="column">
                <h2 class="chart-title">MAL ID Distribution</h2>
                <div class="chart-container" id="scatterChart"></div>
            </div>
            <div class="column">
                <h2 class="chart-title">Anime Categories</h2>
                <div class="chart-container" id="pieChart"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Anime data from your dataset
        var data = [
            {'url': 'https://myanimelist.net/anime/11349/Soredemo_Tsuma_wo_Aishiteru', 'mal_id': 11349, 'title': 'Soredemo Tsuma wo Aishiteru'},
            {'url': 'https://myanimelist.net/anime/6120/Mitama__Nin', 'mal_id': 6120, 'title': 'Mitama: Nin'},
            {'url': 'https://myanimelist.net/anime/54367/Artiswitch_Collection_2021', 'mal_id': 54367, 'title': 'Artiswitch Collection 2021'},
            {'url': 'https://myanimelist.net/anime/48612/Journey__Taiko_Arabia_Hantou_de_no_Kiseki_to_Tatakai_no_Monogatari', 'mal_id': 48612, 'title': 'Journey: Taiko Arabia'},
            {'url': 'https://myanimelist.net/anime/2928/hack__GU_Returner', 'mal_id': 2928, 'title': '.hack//G.U. Returner'},
            {'url': 'https://myanimelist.net/anime/32262/Renai_Boukun', 'mal_id': 32262, 'title': 'Renai Boukun'},
            {'url': 'https://myanimelist.net/anime/45141/Meng_wa', 'mal_id': 45141, 'title': 'Meng wa'},
            {'url': 'https://myanimelist.net/anime/41069/AAside', 'mal_id': 41069, 'title': 'AAside'},
            {'url': 'https://myanimelist.net/anime/1520/Black_Jack', 'mal_id': 1520, 'title': 'Black Jack'},
            {'url': 'https://myanimelist.net/anime/12957/First_Love', 'mal_id': 12957, 'title': 'First Love'}
        ];
        
        // Common chart configuration
        const commonConfig = {
            responsive: true,
            displayModeBar: false
        };
        
        const commonLayout = {
            margin: {l: 60, r: 40, b: 100, t: 40, pad: 4},
            plot_bgcolor: '#ffffff',
            paper_bgcolor: '#ffffff',
            font: {
                family: 'Segoe UI, Tahoma, Geneva, Verdana, sans-serif',
                size: 12,
                color: '#2c3e50'
            }
        };
        
        // 1. Bar Chart - Top 10 Anime by MAL ID
        const barTrace = {
            x: data.map(d => d.title.substring(0, 15) + '...'),
            y: data.map(d => d.mal_id),
            type: 'bar',
            marker: { color: '#3498db' },
            hovertemplate: '<b>%{x}</b><br>MAL ID: %{y}<extra></extra>'
        };
        
        const barLayout = {
            ...commonLayout,
            xaxis: { 
                title: 'Anime Titles',
                tickangle: -45
            },
            yaxis: { title: 'MAL ID' }
        };
        
        Plotly.newPlot('barChart', [barTrace], barLayout, commonConfig);
        
        // 2. Line Chart - MAL ID Trend
        const lineTrace = {
            x: data.map((_, i) => i + 1),
            y: data.map(d => d.mal_id),
            mode: 'lines+markers',
            type: 'scatter',
            line: { color: '#2ecc71', width: 3 },
            marker: { size: 8, color: '#2ecc71' },
            hovertemplate: 'Index: %{x}<br>MAL ID: %{y}<extra></extra>'
        };
        
        const lineLayout = {
            ...commonLayout,
            xaxis: { title: 'Data Points' },
            yaxis: { title: 'MAL ID' }
        };
        
        Plotly.newPlot('lineChart', [lineTrace], lineLayout, commonConfig);
        
        // 3. Scatter Plot - MAL ID Distribution
        const scatterTrace = {
            x: data.map((_, i) => i + 1),
            y: data.map(d => d.mal_id),
            mode: 'markers',
            type: 'scatter',
            marker: { 
                size: 12, 
                color: '#e74c3c',
                opacity: 0.7 
            },
            hovertemplate: '<b>%{text}</b><br>Index: %{x}<br>MAL ID: %{y}<extra></extra>',
            text: data.map(d => d.title)
        };
        
        const scatterLayout = {
            ...commonLayout,
            xaxis: { title: 'Data Points' },
            yaxis: { title: 'MAL ID' }
        };
        
        Plotly.newPlot('scatterChart', [scatterTrace], scatterLayout, commonConfig);
        
        // 4. Pie Chart - Anime Categories (simplified grouping)
        const categories = data.map(d => {
            if (d.mal_id < 5000) return 'Classic Era';
            if (d.mal_id < 20000) return 'Modern Era';
            if (d.mal_id < 40000) return 'Recent Era';
            return 'Latest Era';
        });
        
        const categoryCounts = categories.reduce((acc, cat) => {
            acc[cat] = (acc[cat] || 0) + 1;
            return acc;
        }, {});
        
        const pieTrace = {
            labels: Object.keys(categoryCounts),
            values: Object.values(categoryCounts),
            type: 'pie',
            marker: {
                colors: ['#3498db', '#2ecc71', '#e74c3c', '#f39c12']
            },
            hovertemplate: '<b>%{label}</b><br>Count: %{value}<br>Percent: %{percent}<extra></extra>'
        };
        
        const pieLayout = {
            ...commonLayout,
            showlegend: true,
            legend: {
                orientation: 'h',
                yanchor: 'bottom',
                y: -0.3,
                xanchor: 'center',
                x: 0.5
            }
        };
        
        Plotly.newPlot('pieChart', [pieTrace], pieLayout, commonConfig);
        
    </script>
</body>
</html>
