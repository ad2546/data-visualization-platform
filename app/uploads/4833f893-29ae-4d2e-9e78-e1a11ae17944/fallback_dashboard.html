<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZSIOC Industry Overview Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 300;
        }
        .row {
            display: flex;
            width: 100%;
            margin-bottom: 20px;
            gap: 20px;
        }
        .column {
            flex: 1;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }
        .column:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }
        .chart-title {
            text-align: center;
            margin-bottom: 15px;
            color: #34495e;
            font-size: 1.2rem;
            font-weight: 500;
        }
        .chart-container {
            min-height: 400px;
            width: 100%;
        }
        @media (max-width: 768px) {
            .row {
                flex-direction: column;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>NZSIOC Industry Financial Performance Overview</h1>

        <div class="row">
            <div class="column">
                <h2 class="chart-title">Total Income by Year</h2>
                <div class="chart-container" id="totalIncomeChart"></div>
            </div>
            <div class="column">
                <h2 class="chart-title">Total Expenditure by Year</h2>
                <div class="chart-container" id="totalExpenditureChart"></div>
            </div>
        </div>

        <div class="row">
            <div class="column">
                <h2 class="chart-title">Sales, Government Funding, Grants and Subsidies by Year</h2>
                <div class="chart-container" id="salesGovFundingChart"></div>
            </div>
            <div class="column">
                <h2 class="chart-title">Interest, Dividends and Donations by Year</h2>
                <div class="chart-container" id="interestDividendsChart"></div>
            </div>
        </div>

    </div>

    <script>
        // Sample data (replace with your actual data)
        const data = {
            years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024],
            totalIncome: [900000, 910000, 920000, 930000, 940000, 950000, 960000, 970000, 975000, 977000, 978000, 979594],
            totalExpenditure: [750000, 760000, 770000, 780000, 790000, 800000, 810000, 820000, 830000, 840000, 850000, 856960],
            salesGovFunding: [700000, 710000, 720000, 730000, 740000, 750000, 760000, 770000, 800000, 810000, 820000, 838626],
            interestDividends: [100000, 102000, 104000, 106000, 108000, 110000, 112000, 111000, 111500, 111800, 112000, 112188],
            nonOperatingIncome: [20000, 22000, 24000, 26000, 28000, 27000, 27500, 28000, 28200, 28500, 28700, 28781]
        };

        // Function to create a line chart
        function createLineChart(containerId, title, xData, yData, yTitle, color) {
            const trace = {
                x: xData,
                y: yData,
                mode: 'lines+markers',
                type: 'scatter',
                name: title,
                line: {
                    color: color,
                    width: 3
                },
                marker: {
                    size: 8,
                    color: color,
                    symbol: 'circle'
                },
                hovertemplate: '<b>%{x}</b><br>' + 
                              yTitle + ': $%{y:,.0f}<br>' +
                              '<extra></extra>'
            };

            const layout = {
                xaxis: { 
                    title: 'Year',
                    showgrid: true,
                    gridcolor: '#e1e1e1',
                    tickformat: 'd'
                },
                yaxis: { 
                    title: yTitle,
                    showgrid: true,
                    gridcolor: '#e1e1e1',
                    tickformat: ',.0f'
                },
                margin: {l: 80, r: 40, b: 60, t: 40, pad: 4},
                plot_bgcolor: '#ffffff',
                paper_bgcolor: '#ffffff',
                font: {
                    family: 'Segoe UI, Tahoma, Geneva, Verdana, sans-serif',
                    size: 12,
                    color: '#2c3e50'
                },
                showlegend: false
            };

            const config = {
                responsive: true,
                displayModeBar: false
            };

            Plotly.newPlot(containerId, [trace], layout, config);
        }

        // Create the charts with distinct colors
        createLineChart('totalIncomeChart', 'Total Income', data.years, data.totalIncome, 'Dollars', '#2ecc71');
        createLineChart('totalExpenditureChart', 'Total Expenditure', data.years, data.totalExpenditure, 'Dollars', '#e74c3c');
        createLineChart('salesGovFundingChart', 'Sales, Government Funding, Grants and Subsidies', data.years, data.salesGovFunding, 'Dollars', '#3498db');
        createLineChart('interestDividendsChart', 'Interest, Dividends and Donations', data.years, data.interestDividends, 'Dollars', '#f39c12');

    </script>
</body>
</html>
